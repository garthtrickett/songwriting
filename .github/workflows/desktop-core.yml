name: Desktop core
on: [push, pull_request]
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: bun install --frozen-lockfile
      - run: rustup show active-toolchain
      - uses: actions/cache@v4
        id: decoder
        with:
          path: .agent/ffmpeg-proof
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/desktop/ffmpeg.json', 'scripts/desktop/build-ffmpeg.py') }}
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python
      - if: runner.os == 'Windows' && steps.decoder.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: python scripts/desktop/build-ffmpeg.py
      - if: runner.os != 'Windows' && steps.decoder.outputs.cache-hit != 'true'
        run: python3 scripts/desktop/build-ffmpeg.py
      - if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          echo "SONGWRITER_FFMPEG=$(cygpath -w "$PWD/.agent/ffmpeg-proof/ffmpeg.exe")" >> "$GITHUB_ENV"
          cygpath -w /ucrt64/bin >> "$GITHUB_PATH"
      - if: runner.os != 'Windows'
        run: echo "SONGWRITER_FFMPEG=$PWD/.agent/ffmpeg-proof/ffmpeg" >> "$GITHUB_ENV"
      - run: bun run verify:desktop
  native-window:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev webkit2gtk-driver xvfb dbus-x11 pulseaudio libasound2-plugins
      - run: bun install --frozen-lockfile
      - run: bun run desktop:build --debug
      - run: xvfb-run -a dbus-run-session -- python3 scripts/desktop/audio-smoke.py src-tauri/target/debug/songwriter-desktop .agent/native-smoke
      - run: cargo build --manifest-path src-tauri/Cargo.toml --locked -p song-media
      - run: python3 scripts/desktop/media-smoke.py src-tauri/target/debug/song-media .agent/native-smoke/media
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-window-evidence
          path: .agent/native-smoke/
          include-hidden-files: true
