name: Nix desktop shell
on: [push, pull_request]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --all-systems --no-build
      - name: Verify tools and desktop inside Nix
        run: |
          nix develop --command bash -euc '
            rustc --version
            cargo --version
            test "$(bun --version)" = "$(cat .bun-version)"
            pkg-config --modversion gtk+-3.0 webkit2gtk-4.1 javascriptcoregtk-4.1 libsoup-3.0 openssl ayatana-appindicator3-0.1
            bun install --frozen-lockfile
            bunx tauri --version
            bun run verify
            bun run verify:desktop
          '
