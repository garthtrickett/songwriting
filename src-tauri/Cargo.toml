[package]
name = "songwriter-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
song-session = { path = "crates/song-session" }
song-agent = { path = "crates/song-agent" }

[lints]
workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]

[workspace]
members = ["crates/song-core", "crates/song-workspace", "crates/song-session", "crates/song-agent"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }

ts-rs = { version = "12", features = ["serde-compat"] }

[workspace.lints.rust]
unsafe_code = "forbid"
