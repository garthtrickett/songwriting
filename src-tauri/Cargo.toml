[workspace]
members = ["crates/song-core", "crates/song-workspace"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[workspace.lints.rust]
unsafe_code = "forbid"
