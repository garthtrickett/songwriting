[package]
name = "song-agent"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
song-session = { path = "../song-session" }
song-workspace = { path = "../song-workspace" }
rig-core = { version = "=0.42.0", default-features = false, features = ["reqwest", "rustls"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }

[dev-dependencies]
tempfile = "3"
song-core = { path = "../song-core" }
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints]
workspace = true
